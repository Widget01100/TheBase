<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The Base - Complete Personal Finance Platform for Kenya" />
    <meta name="author" content="Francis" />
    <title>The Base - Kenyan Personal Finance Platform</title>
    <script>
      // ── Apply saved theme BEFORE React mounts to prevent flash of light mode ──
      (function () {
        try {
          var saved = localStorage.getItem('thebase.theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || (!saved && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          // localStorage might be blocked — fail silently
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
